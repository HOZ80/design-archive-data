<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasarım Arşivi</title>
<style>
  :root{
    --bg:#FFFFFF;
    --panel:#F3F6FB;
    --border:#DCE4F0;
    --text:#14213D;
    --text-soft:#6B7A97;
    --text-faint:#8C97AD;
    --accent:#2554C7;
    --accent-soft:#2554C71A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  .brand{
    font-family:'Fraunces', Georgia, serif;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:22px 40px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  header .title-block{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  header h1{margin:0;font-size:24px;font-weight:600;}
  header .subtitle{font-size:13px;color:var(--text-soft);}

  .search-box{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:9px 14px;width:300px;max-width:100%;
  }
  .search-box input{
    border:none;outline:none;background:transparent;
    font-family:inherit;font-size:14px;color:var(--text);width:100%;
  }
  .search-box input::placeholder{color:var(--text-faint);}

  .tabs{
    display:flex;gap:8px;flex-wrap:wrap;
    padding:18px 40px 0 40px;
  }
  .tab{
    cursor:pointer;user-select:none;
    padding:8px 16px;border-radius:999px;
    font-size:13px;font-weight:500;
    border:1px solid var(--border);
    background:#FFFFFF;color:#3C4A66;
  }
  .tab:hover{background:var(--panel);}
  .tab.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#FFFFFF;
  }

  .meta-bar{
    padding:14px 40px 0 40px;
    font-size:13px;color:var(--text-soft);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:22px;
    padding:20px 40px 48px 40px;
  }

  .card{
    background:#fff;
    border:1px solid #E1E8F2;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(20,33,61,.10);
  }
  .thumb{
    height:150px;
    background:linear-gradient(135deg,#EEF3FB,#E4ECF9);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .placeholder{
    font-size:12px;letter-spacing:.04em;color:var(--text-faint);
    font-family:'Fraunces', Georgia, serif;
  }
  .card-body{padding:14px 16px;}
  .card-top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .kod-badge{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;font-size:12px;color:var(--accent);
    background:var(--accent-soft);
    padding:3px 10px;border-radius:20px;
  }
  .tarih{font-size:12px;color:var(--text-faint);}
  .ad{font-size:14px;font-weight:500;line-height:1.4;
      overflow-wrap:anywhere;}
  .alt-bilgi{font-size:12px;color:var(--text-soft);margin-top:4px;}

  .empty-state{
    padding:60px 40px;text-align:center;color:var(--text-soft);
    font-size:14px;
  }

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,33,61,.55);
    display:none;align-items:center;justify-content:center;
    padding:24px;z-index:100;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:#fff;border-radius:16px;max-width:640px;width:100%;
    max-height:88vh;overflow:auto;position:relative;
  }
  .modal-close{
    position:absolute;top:14px;right:14px;
    width:32px;height:32px;border-radius:50%;
    border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;color:var(--text-soft);
  }
  .modal-thumb{
    height:280px;background:linear-gradient(135deg,#EEF3FB,#E4ECF9);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .modal-thumb img{width:100%;height:100%;object-fit:contain;background:#fff;}
  .modal-body{padding:24px 28px 28px 28px;}
  .modal-body h2{margin:0 0 12px 0;font-size:18px;font-family:'Fraunces',Georgia,serif;}
  .field-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .field-row:last-child{border-bottom:none;}
  .field-label{width:110px;flex-shrink:0;color:var(--text-soft);}
  .field-value{color:var(--text);overflow-wrap:anywhere;}
</style>
</head>
<body>

<header>
  <div class="title-block">
    <span class="brand" style="font-weight:600;font-size:26px;">Tasarım Arşivi</span>
    <span class="subtitle">Kişisel iş kütüphanesi</span>
  </div>
  <label class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7A97" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" type="text" placeholder="İş adı veya kod ara...">
  </label>
</header>

<div class="tabs" id="tabs"></div>
<div class="meta-bar" id="metaBar"></div>
<div class="grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">Bu kategoride / aramada sonuç bulunamadı.</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-close" id="modalClose">&times;</div>
    <div class="modal-thumb" id="modalThumb"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* ============================================================
   AYAR: Google E-Tablosu'nun "web'de yayınla" CSV linkini
   aşağıya, tırnakların içine yapıştır.
   (Google Sheets içinde: Dosya > Paylaş > Web'de yayınla,
    format olarak "Virgülle ayrılmış değerler (.csv)" seç,
    çıkan linki buraya yapıştır.)
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTvJi6dyQZVW1RiSde7UwTOlR8WfQtLU-vOiJvE22GeAtsTmuc6_DYahFvaQm_3rdyf0zaZEaYtqS_7/pub?output=csv";

/* Görsellerin bulunduğu klasör (bu dosyayla aynı depoda) */
const IMAGE_FOLDER = "public/";

/* Bir dosya adı için sırayla denenecek uzantılar */
const IMAGE_EXTENSIONS = ["jpg", "jpeg", "png", "webp", "gif"];

/* ============================================================ */

let allRecords = [];
let activeCategory = "Tümü";
let searchTerm = "";

function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}

function recordsFromCsv(text) {
  const rows = parseCsv(text);
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  const idx = {
    kod: headers.indexOf("Kod"),
    kategori: headers.indexOf("Kategori"),
    ad: headers.indexOf("Dosya Adı"),
    tarih: headers.indexOf("Tarih"),
    dil: headers.indexOf("Dil"),
  };
  return rows.slice(1).map(r => ({
    kod: (r[idx.kod] || "").trim(),
    kategori: (r[idx.kategori] || "").trim(),
    ad: (r[idx.ad] || "").trim(),
    tarih: (r[idx.tarih] || "").trim(),
    dil: (r[idx.dil] || "").trim(),
  })).filter(rec => rec.kod);
}

function setImageWithFallback(imgEl, placeholderEl, baseName) {
  let extIdx = 0;
  function tryNext() {
    if (extIdx >= IMAGE_EXTENSIONS.length) {
      imgEl.style.display = "none";
      placeholderEl.style.display = "flex";
      return;
    }
    const ext = IMAGE_EXTENSIONS[extIdx++];
    imgEl.src = IMAGE_FOLDER + encodeURIComponent(baseName) + "." + ext;
  }
  imgEl.onerror = tryNext;
  imgEl.onload = () => { placeholderEl.style.display = "none"; imgEl.style.display = "block"; };
  tryNext();
}

function render() {
  const grid = document.getElementById("grid");
  const emptyState = document.getElementById("emptyState");
  const metaBar = document.getElementById("metaBar");
  grid.innerHTML = "";

  const term = searchTerm.trim().toLowerCase();
  const filtered = allRecords.filter(rec => {
    const catOk = activeCategory === "Tümü" || rec.kategori === activeCategory;
    if (!catOk) return false;
    if (!term) return true;
    return rec.kod.toLowerCase().includes(term) || rec.ad.toLowerCase().includes(term);
  });

  metaBar.textContent = filtered.length + " kayıt";
  emptyState.style.display = filtered.length ? "none" : "block";

  filtered.forEach(rec => {
    const card = document.createElement("div");
    card.className = "card";

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    const img = document.createElement("img");
    img.style.display = "none";
    img.alt = rec.ad;
    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";
    placeholder.textContent = "GÖRSEL YOK";
    thumb.appendChild(img);
    thumb.appendChild(placeholder);
    setImageWithFallback(img, placeholder, rec.ad);

    const body = document.createElement("div");
    body.className = "card-body";
    body.innerHTML = `
      <div class="card-top">
        <span class="kod-badge">${rec.kod}</span>
        <span class="tarih">${rec.tarih || ""}</span>
      </div>
      <div class="ad">${rec.ad}</div>
      <div class="alt-bilgi">${rec.kategori}${rec.dil ? " · " + rec.dil : ""}</div>
    `;

    card.appendChild(thumb);
    card.appendChild(body);
    card.addEventListener("click", () => openModal(rec));
    grid.appendChild(card);
  });
}

function openModal(rec) {
  const overlay = document.getElementById("modalOverlay");
  const modalThumb = document.getElementById("modalThumb");
  const modalBody = document.getElementById("modalBody");

  modalThumb.innerHTML = "";
  const img = document.createElement("img");
  img.style.display = "none";
  img.alt = rec.ad;
  const placeholder = document.createElement("div");
  placeholder.className = "placeholder";
  placeholder.textContent = "GÖRSEL YOK";
  modalThumb.appendChild(img);
  modalThumb.appendChild(placeholder);
  setImageWithFallback(img, placeholder, rec.ad);

  modalBody.innerHTML = `
    <h2>${rec.ad}</h2>
    <div class="field-row"><div class="field-label">Kod</div><div class="field-value">${rec.kod}</div></div>
    <div class="field-row"><div class="field-label">Kategori</div><div class="field-value">${rec.kategori}</div></div>
    <div class="field-row"><div class="field-label">Tarih</div><div class="field-value">${rec.tarih || "—"}</div></div>
    <div class="field-row"><div class="field-label">Dil</div><div class="field-value">${rec.dil || "—"}</div></div>
  `;
  overlay.classList.add("open");
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

function buildTabs() {
  const cats = ["Tümü", ...Array.from(new Set(allRecords.map(r => r.kategori))).sort()];
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  cats.forEach(cat => {
    const tab = document.createElement("div");
    tab.className = "tab" + (cat === activeCategory ? " active" : "");
    tab.textContent = cat;
    tab.addEventListener("click", () => {
      activeCategory = cat;
      buildTabs();
      render();
    });
    tabsEl.appendChild(tab);
  });
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  render();
});
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "modalOverlay") closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

async function loadData() {
  const metaBar = document.getElementById("metaBar");
  if (SHEET_CSV_URL.indexOf("BURAYA_") === 0) {
    metaBar.textContent = "Veri kaynağı henüz bağlanmadı — yukarıdaki SHEET_CSV_URL alanına Google E-Tablosu linkini ekle.";
    return;
  }
  try {
    metaBar.textContent = "Yükleniyor...";
    const res = await fetch(SHEET_CSV_URL);
    const text = await res.text();
    allRecords = recordsFromCsv(text);
    buildTabs();
    render();
  } catch (err) {
    metaBar.textContent = "Veri yüklenemedi. İnternet bağlantını ve tablo linkini kontrol et.";
  }
}

loadData();
</script>
</body>
</html>
